harnesses:
  claude-code-cli:
    briefFile: CLAUDE.md
    mcp: stdio
    mcpConfigPath: .mcp.json
    supervisable: true
    # No positional prompt: with stream-json input the job is the first turn
    # written to stdin, which is also what lets later turns land in the queue.
    spawn: [claude, -p, --input-format, stream-json, --output-format, stream-json, --verbose]
    turnFormat: stream-json
  claude-code-app:
    briefFile: CLAUDE.md
    mcp: stdio
    mcpConfigPath: .mcp.json
    supervisable: false
  codex-cli:
    briefFile: AGENTS.md
    mcp: stdio
    mcpConfigPath: "~/.codex/config.toml"
    supervisable: true
    spawn: [codex, exec, --json]
  codex-app:
    briefFile: AGENTS.md
    mcp: unverified
    supervisable: false
  cursor-cli:
    briefFile: .cursor/rules/crosstalk.mdc
    mcp: stdio
    mcpConfigPath: .cursor/mcp.json
    supervisable: true
    spawn: [cursor-agent, -p]
  cursor-app:
    briefFile: .cursor/rules/crosstalk.mdc
    mcp: stdio
    mcpConfigPath: .cursor/mcp.json
    supervisable: false
  claude-code-live:
    briefFile: CLAUDE.md
    mcp: stdio
    mcpConfigPath: .mcp.json
    supervisable: true
    # An interactive seat the operator can watch and steer from a phone.
    # `--remote-control` needs a terminal, so `openSession` wraps this in a pty;
    # spawned without one, Claude Code falls back to print mode and exits.
    # `bypassPermissions` because an interactive session that asks is a session
    # that stalls, and nobody is at the keyboard at 4am.
    spawn: [claude, --remote-control, --permission-mode, bypassPermissions]
    turnFormat: interactive
